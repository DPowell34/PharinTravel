<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D4D CRM – Agent Login</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;
       display:flex;align-items:center;justify-content:center;color:#0f2027}
  .card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);
        width:100%;max-width:380px;padding:40px 34px;text-align:center}
  .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#2c5364;font-weight:700}
  h1{font-size:22px;margin:6px 0 2px;color:#122;font-weight:700}
  .sub{color:#7a8a92;font-size:13px;margin-bottom:26px}
  input{width:100%;padding:13px 14px;border:1.5px solid #d7dee2;border-radius:10px;
        font-size:15px;outline:none;transition:border .15s}
  input:focus{border-color:#2c5364}
  button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;cursor:pointer;
         background:#2c5364;color:#fff;font-size:15px;font-weight:600;transition:background .15s}
  button:hover{background:#203a43}
  .err{color:#c0392b;font-size:13px;margin-top:14px;min-height:16px}
  .lock{font-size:30px;margin-bottom:10px}
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <img src="/assets/d4d-logo.jpg" alt="Destined 4 Destinations" style="width:110px;height:110px;object-fit:contain;border-radius:50%;margin:0 auto 8px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.15)">
    <div class="brand">Destined 4 Destinations</div>
    <h1>Agent Login</h1>
    <div class="sub">Enter your password to access the CRM.</div>
    <input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
    <button type="submit">Sign In</button>
    <div class="err" id="err"></div>
  </form>
<script>
(function(){
  var f=document.getElementById('loginForm');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var pw=document.getElementById('pw').value;
    if(pw==='Agent1038'){
      try{sessionStorage.setItem('d4d_crm_authed','1');}catch(_){}
      window.location.replace('index.html');
    }else{
      document.getElementById('err').textContent='Incorrect password';
      document.getElementById('pw').value='';
      document.getElementById('pw').focus();
    }
  });
})();
</script>
</body>
</html>
